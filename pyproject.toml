[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scodoc-api"
version = "1.1.0"
description = "Bibliothèque Python non officielle pour interagir avec l'API ScoDoc (passerelle Scodoc-Notes v7:2:3)."
readme = "README.md"
authors = [
    { name = "Raphaël Namur" }
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "urllib3>=1.26.0",
    "python-dotenv>=1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/SkillFXX/scodoc-api"
Repository = "https://github.com/SkillFXX/scodoc-api"
"Bug Tracker" = "https://github.com/SkillFXX/scodoc-api/issues"

